}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(139,92,246,.4);
}

.btn-primary:active{
  transform:translateY(0) scale(.98);
}

.btn-gold{
  background:linear-gradient(135deg,#FFD166,#FFB84D) !important;
  color:#0B0716 !important;
  box-shadow:0 10px 26px rgba(255,209,102,.28);
}

.btn-gold:hover{
  box-shadow:0 14px 30px rgba(255,209,102,.4);
}

.btn-ghost{
  transition:transform .2s ease, background .2s ease, border-color .2s ease;
}

.btn-ghost:hover{
  transform:translateY(-2px);
  background:rgba(139,92,246,.14);
}

.progress-track{
  overflow:hidden;
  background:#140B2E;
  border:1px solid var(--line);
}

.progress-fill{
  background:linear-gradient(90deg,#8B5CF6,#7C3AED,#A78BFA);
  background-size:200% 100%;
  animation:shimmer 3.2s linear infinite;
  transition:width .9s cubic-bezier(.2,.8,.2,1);
}

.dot{
  width:9px;
  height:9px;
  border-radius:999px;
  background:var(--green);
  animation:pulseDot 1.8s infinite;
}

.ticker-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:ticker 26s linear infinite;
}

.nav-link{
  transition:color .2s ease, background .2s ease;
}

.nav-link.active{
  color:#FFFFFF;
  background:linear-gradient(135deg,#8B5CF6,#7C3AED);
}

.chip{
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
}

input,textarea{
  outline:none;
}

input:focus,textarea:focus{
  border-color:rgba(139,92,246,.7)!important;
  box-shadow:0 0 0 3px rgba(139,92,246,.18);
}

.opt-btn{
  transition:all .2s ease;
}

.opt-btn:hover{
  border-color:rgba(139,92,246,.65);
  transform:translateX(3px);
}

.opt-btn.selected{
  border-color:var(--green);
  background:rgba(139,92,246,.16);
}

.opt-btn.correct{
  border-color:var(--green);
  background:rgba(139,92,246,.2);
}

.opt-btn.wrong{
  border-color:var(--red);
  background:rgba(255,119,119,.12);
}

/* Language toggle — animated pill */

.lang-pill{
  position:relative;
  display:flex;
  align-items:center;
  padding:3px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
}

.lang-thumb{
  position:absolute;
  top:3px;
  bottom:3px;
  left:3px;
  width:calc(50% - 3px);
  border-radius:999px;
  background:linear-gradient(135deg,#8B5CF6,#7C3AED);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
}

.lang-thumb-en{
  transform:translateX(100%);
}

.lang-btn{
  position:relative;
  z-index:1;
  min-width:38px;
  padding:5px 6px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  color:var(--muted);
  transition:color .25s ease;
}

.lang-btn-active{
  color:#FFFFFF;
}

/* Ghost mascot — pure CSS shape + JS motion, violet glow + gold eyes accent */

.ghost-wrap{
  position:relative;
  width:168px;
  height:216px;
  margin:18px auto 0;
  animation:ghostFloat 3.8s ease-in-out infinite;
  cursor:pointer;
  filter:drop-shadow(0 0 18px rgba(139,92,246,.45));
}

.ghost-jump{
  animation:ghostJump .65s cubic-bezier(.2,.8,.2,1);
}

.ghost-body{
  position:relative;
  width:168px;
  height:170px;
  background:linear-gradient(180deg,#FFFFFF,#DDD0FE);
  border-radius:84px 84px 14px 14px;
  box-shadow:0 18px 34px rgba(0,0,0,.35), 0 0 34px rgba(139,92,246,.35), inset -10px -8px 22px rgba(139,92,246,.28);
  overflow:visible;
}

.ghost-face{
  position:absolute;
  inset:0;
}

.ghost-eye{
  position:absolute;
  top:62px;
  width:28px;
  height:34px;
  border-radius:50%;
  background:#0B0716;
  display:grid;
  place-items:center;
  overflow:hidden;
  transition:transform .18s ease;
}

.ghost-eye:first-child{
  left:40px;
}

.ghost-eye:nth-child(2){
  right:40px;
}

.ghost-blink{
  transform:scaleY(.08);
}

.ghost-pupil{
  width:20px;
  height:24px;
  border-radius:50%;
  background:#0B0716;
  display:grid;
  place-items:center;
  transition:transform .12s ease;
}

.ghost-shine{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#FFD166;
  margin:-6px 0 0 -5px;
  box-shadow:0 0 8px rgba(255,209,102,.9);
}

.ghost-mouth{
  position:absolute;
  top:112px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:11px;
  border-radius:0 0 12px 12px;
  background:#0B0716;
}

.ghost-blush{
  position:absolute;
  top:106px;
  width:20px;
  height:11px;
  border-radius:50%;
  background:rgba(139,92,246,.38);
  filter:blur(1px);
}

.ghost-blush.left{
  left:24px;
}

.ghost-blush.right{
  right:24px;
}

.ghost-arm{
  position:absolute;
  top:102px;
  width:30px;
  height:14px;
  border-radius:999px;
  background:#fff;
  box-shadow:0 4px 10px rgba(0,0,0,.18);
}

.ghost-arm.left{
  left:-12px;
  transform:rotate(24deg);
  transform-origin:right center;
  animation:ghostWave 3.2s ease-in-out infinite;
}

.ghost-arm.right{
  right:-12px;
  transform:rotate(-24deg);
}

.ghost-waves{
  display:flex;
  justify-content:space-between;
  margin-top:-4px;
  padding:0 1px;
}

.ghost-waves i{
  display:block;
  width:42px;
  height:20px;
  background:#DDD0FE;
  border-radius:0 0 21px 21px;
}

.ghost-shadow{
  width:118px;
  height:15px;
  margin:12px auto 0;
  border-radius:50%;
  background:#000;
  animation:ghostShadow 3.8s ease-in-out infinite;
}

/* Mini ghost in header logo */

.mini-ghost{
  position:relative;
  display:inline-block;
  width:26px;
  height:30px;
  background:#fff;
  border-radius:13px 13px 3px 3px;
  overflow:visible;
}

.mini-eye{
  position:absolute;
  top:10px;
  width:5px;
  height:7px;
  border-radius:50%;
  background:#0B0716;
  animation:miniBlink 3s infinite;
}

.mini-eye:nth-child(1){
  left:6px;
}

.mini-eye:nth-child(2){
  right:6px;
}

.mini-mouth{
  position:absolute;
  top:19px;
  left:50%;
  transform:translateX(-50%);
  width:5px;
  height:3px;
  border-radius:0 0 4px 4px;
  background:#0B0716;
}

.mini-wave{
  position:absolute;
  bottom:-3px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
}

.mini-wave i{
  display:block;
  width:9px;
  height:4px;
  background:#fff;
  border-radius:0 0 5px 5px;
}

/* Floating Telegram button + support panel — Telegram blue kept for recognizability */

.telegram-fab{
  position:fixed;
  right:16px;
  bottom:92px;
  z-index:45;
  width:60px;
  height:60px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.65);
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#2AABEE,#229ED9);
  box-shadow:0 14px 30px rgba(34,158,217,.45);
  animation:telegramFloat 3s ease-in-out infinite;
  transition:transform .2s ease, box-shadow .2s ease;
  cursor:pointer;
}

.telegram-fab:hover{
  transform:scale(1.1);
  box-shadow:0 18px 36px rgba(34,158,217,.6);
}

.telegram-pulse{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid #2AABEE;
  animation:telegramPulse 2.2s ease-out infinite;
  pointer-events:none;
}

.support-panel{
  animation:panelUp .34s cubic-bezier(.2,.8,.2,1) both;
}

/* Mobile-first type, spacing and containment — no horizontal scroll */

html,body{
  max-width:100%;
  overflow-x:clip;
}

img,svg,video{
  max-width:100%;
}

h1,h2,h3,p,li,span,button,a,label{
  overflow-wrap:anywhere;
  word-break:break-word;
}

@media (min-width:641px){
  .card-hover{
    padding:16px;
  }
}

@media (max-width:640px){
  body{

  .btn-primary,.btn-ghost{
    font-size:.85rem!important;

  /* Smaller ghost so it never pushes the hero text */

    width:140px;

  }

  .ghost-eye{
    top:52px;

  }

  }

  .ghost-eye:nth-child(2){

    top:95px;
  }

    top:86px;
  }

  }

  .ghost-shadow{
    width:96px;
  }

  .support-panel{

  }
}

@media (max-width:767px){
  .telegram-fab{
    width:52px;

  }

@media (min-width:768px){

  }

o:"প্রতিটি candle একটি নির্দিষ্ট সময়ে দামের গল্প বলে। Body দেখায় open থেকে close পর্যন্ত যাত্রা, আর wick দেখায় সেই সময়ে দাম কতদূর গিয়ে ফিরে এসেছিল।",points:["Bullish candle: close, open-এর উপরে থাকে","Bearish candle: close, open-এর নিচে থাকে","লম্বা wick মানে দাম প্রত্যাখ্যাত হয়েছে","একটি candle দিয়ে সিদ্ধান্ত নয়, context দেখুন"],watch:"Candlestick basics Open High Low Close",questions:[{q:"একটি candle-এর body কী দেখায়?",options:["দিনের সর্বোচ্চ দাম","Open থেকে Close পর্যন্ত দামের পরিবর্তন","শুধু wick-এর দৈর্ঘ্য","পরের দিনের দাম"],answer:1,explain:"Body হলো open ও close-এর মধ্যকার অংশ। এটাই দেখায় ওই সময়ে ক্রেতা না বিক্রেতা শক্তিশালী ছিল।"},{q:"Upper wick লম্বা হলে সাধারণত কী বোঝায়?",options:["দাম সহজে উপরে গেছে","উপরের দিকে দাম গিয়ে প্রত্যাখ্যাত হয়েছে","কোনো লেনদেন হয়নি","Trend নিশ্চিত হয়ে গেছে"],answer:1,explain:"উপরে গিয়ে দাম টিকতে না পারলে লম্বা upper wick তৈরি হয়। এটি একা কোনো নিশ্চিত সংকেত নয়।"},{q:"Bullish candle চিনবেন কীভাবে?",options:["Close, Open-এর নিচে","Close, Open-এর উপরে","Wick না থাকলে","Body খুব ছোট হলে"],answer:1,explain:"Close, open-এর উপরে থাকলে candle-কে bullish ধরা হয়। রঙের চেয়ে এই সম্পর্কটাই মূল বিষয়।"}]},{id:2,title:"Hammer ও Pin Bar",enTitle:"Hammer & Pin Bar",goal:"লম্বা wick, ছোট body এবং context বোঝা।",enGoal:"Understand long wick, small body and context.",minutes:16,level:"Beginner",intro:"Hammer বা pin bar হলো প্রত্যাখ্যানের ছবি। দাম একদিকে গিয়ে ফিরে এসেছে, কিন্তু এই সংকেত তখনই গুরুত্বপূর্ণ যখন তা কোনো গুরুত্বপূর্ণ জায়গায় তৈরি হয়।",points:["লম্বা wick + ছোট body হলো মূল কাঠামো","Support-এর কাছে hammer বেশি অর্থবহ","পরের candle-এর নিশ্চিতকরণ দেখুন","সব pin bar ট্রেডযোগ্য নয়"],watch:"Hammer pin bar candlestick pattern context",questions:[{q:"Hammer-এর সবচেয়ে গুরুত্বপূর্ণ বৈশিষ্ট্য কোনটি?",options:["বড় body","লম্বা নিচের wick ও ছোট body","কোনো wick নেই","পরপর ৫টি candle"],answer:1,explain:"লম্বা নিচের wick দেখায় নিচের দাম প্রত্যাখ্যাত হয়েছে, আর ছোট body দেখায় দাম close-এর কাছে ফিরে এসেছে।"},{q:"Pin bar কোথায় বেশি গুরুত্বপূর্ণ?",options:["চার্টের যেকোনো জায়গায়","গুরুত্বপূর্ণ support / resistance-এর কাছে","শুধু সকালে","শুধু বড় candle-এর পরে"],answer:1,explain:"Context ছাড়া pin bar দুর্বল। Level-এর কাছে তৈরি হলে তার অর্থ অনেক বেশি হয়।"},{q:"Pin bar দেখলেই কী করা উচিত?",options:["সঙ্গে সঙ্গে ট্রেড নেওয়া","Context ও পরের price action দেখে সিদ্ধান্ত নেওয়া","সব টাকা ব্যবহার করা","অন্য timeframe না দেখা"],answer:1,explain:"একটি candle কখনোই পুরো সিদ্ধান্ত হতে পারে না। Level, trend ও পরের candle মিলিয়ে দেখুন।"}]},{id:3,title:"Support ও Resistance",enTitle:"Support & Resistance",goal:"দামের প্রতিক্রিয়ার অঞ্চল খুঁজে বের করা।",enGoal:"Find the zones where price reacts.",minutes:18,level:"Beginner",intro:"Support ও resistance কোনো পাতলা লাইন নয়, বরং দাম যেখানে বারবার প্রতিক্রিয়া দেখিয়েছে সেই অঞ্চল। অঞ্চল হিসেবে ভাবলে ভুল সংকেত কমে।",points:["দাম যেখানে থেমেছে বা ঘুরেছে, সেটাই অঞ্চল","যত বেশি স্পর্শ, অঞ্চল তত গুরুত্বপূর্ণ","Level ভাঙলে ভূমিকা বদলাতে পারে","সঠিক অঞ্চলে ধৈর্য সবচেয়ে বড় দক্ষতা"],watch:"Support resistance zones price action",questions:[{q:"Support বলতে কী বোঝায়?",options:["দাম যেখানে নামতে বাধা পায়","দাম যেখানে কখনো যায় না","সবচেয়ে উঁচু দাম","একটি নির্দিষ্ট তারিখ"],answer:0,explain:"Support অঞ্চলে বিক্রির চাপ কমে বা কেনার আগ্রহ বাড়ে, ফলে দাম সেখানে থামতে বা ঘুরতে পারে।"},{q:"Support ও resistance-কে কীভাবে দেখা ভালো?",options:["একদম পাতলা লাইন হিসেবে","একটি অঞ্চল বা zone হিসেবে","শুধু সংখ্যা হিসেবে","রঙ দিয়ে"],answer:1,explain:"দাম সবসময় একই পয়েন্টে থামে না। অঞ্চল হিসেবে দেখলে বাস্তব price action বোঝা সহজ হয়।"},{q:"একটি resistance ভেঙে উপরে গেলে কী হতে পারে?",options:["সেটি support হিসেবে কাজ করতে পারে","চার্ট মুছে যায়","দাম আর নামে না","সব ট্রেড লাভ হয়"],answer:0,explain:"ভাঙা level প্রায়ই ভূমিকা বদলায়। একে polarity বা role reversal বলে।"}]},{id:4,title:"Trend ও Market Structure",enTitle:"Trend & Market Structure",goal:"Higher high, higher low, lower high, lower low চিনতে শেখা।",enGoal:"Learn higher high, higher low, lower high and lower low.",minutes:20,level:"Beginner",intro:"Trend হলো দামের ধারাবাহিক গতিপথ। Higher high ও higher low মিলে uptrend, আর lower high ও lower low মিলে downtrend তৈরি করে।",points:["Uptrend: HH + HL","Downtrend: LH + LL","Range: পরিষ্কার HH/LL নেই","Swing point দিয়ে structure আঁকুন"],watch:"Market structure higher high higher low trend",questions:[{q:"Uptrend-এ কী দেখা যায়?",options:["Lower high ও lower low","Higher high ও higher low","শুধু সমান দাম","কোনো swing নেই"],answer:1,explain:"Uptrend-এ প্রতিটি নতুন high আগেরটির উপরে এবং প্রতিটি pullback আগের low-এর উপরে থাকে।"},{q:"Downtrend ভাঙার প্রথম ইঙ্গিত কোনটি?",options:["Lower low তৈরি হওয়া","Lower high ভেঙে যাওয়া","দাম একই থাকা","Candle-এর রঙ বদলানো"],answer:1,explain:"Lower high ভাঙলে structure দুর্বল হতে শুরু করে। তবে একটিমাত্র break দিয়েই trend বদলে গেছে ধরা ঠিক নয়।"},{q:"Range market-এ কী হয়?",options:["পরিষ্কার HH/HL থাকে","দাম একটি অঞ্চলের মধ্যে ওঠানামা করে","দাম কখনো থামে না","শুধু একটি candle থাকে"],answer:1,explain:"Range-এ দাম support ও resistance-এর মধ্যে ঘোরে। সেখানে trend-এর নিয়ম সরাসরি প্রয়োগ করা ঝুঁকিপূর্ণ।"}]},{id:5,title:"Breakout ও Retest",enTitle:"Breakout & Retest",goal:"Level ভাঙা ও পুনরায় পরীক্ষা করার পার্থক্য শেখা।",enGoal:"Learn the difference between a level break and a retest.",minutes:18,level:"Intermediate",intro:"Breakout মানে দাম level ছাড়িয়ে গেছে। Retest মানে দাম আবার সেই level-এ ফিরে এসে প্রতিক্রিয়া দেখাচ্ছে। দুটোর মধ্যে তাড়াহুড়ো না করে পার্থক্য বোঝা জরুরি।",points:["সব breakout টিকে থাকে না","Retest-এ দাম level ধরে রাখছে কি না দেখুন","Volume ও candle-এর গতি পর্যবেক্ষণ করুন","ভাঙা level-এ অন্ধভাবে ঝাঁপ দেবেন না"],watch:"Breakout retest price action trading",questions:[{q:"Retest কী?",options:["দাম ভাঙা level-এ ফিরে এসে প্রতিক্রিয়া দেখানো","দাম কখনো না ফেরা","নতুন high তৈরি করা","চার্ট বন্ধ করা"],answer:0,explain:"ভাঙার পর দাম প্রায়ই পুরোনো level-এ ফিরে আসে। সেখানে দাম ধরে রাখলে breakout-এর শক্তি বোঝা যায়।"},{q:"Breakout-এর পর সবচেয়ে সাধারণ ভুল কোনটি?",options:["অপেক্ষা করা","দেরি না করে সঙ্গে সঙ্গে বড় ঝুঁকি নেওয়া","Level আবার দেখা","নোট নেওয়া"],answer:1,explain:"Breakout-এর উত্তেজনায় অনেকে ঝুঁকি না মেপে ঢুকে পড়েন। পরিকল্পনা ছাড়া breakout ট্রেড করা ঠিক নয়।"},{q:"একটি শক্তিশালী breakout-এ সাধারণত কী দেখা যায়?",options:["দুর্বল ছোট candle","পরিষ্কার ও দৃঢ়ভাবে level ছাড়িয়ে যাওয়া","কোনো movement নেই","একই দামে আটকে থাকা"],answer:1,explain:"শক্তিশালী breakout-এ দাম সাধারণত পরিষ্কারভাবে level ছাড়ায়। তবুও এটি সাফল্যের নিশ্চয়তা দেয় না।"}]},{id:6,title:"False Breakout ও Liquidity Sweep",enTitle:"False Breakout & Liquidity Sweep",goal:"Level-এর বাইরে গিয়ে আবার ফিরে আসা price action বোঝা।",enGoal:"Understand price action that goes outside a level and comes back.",minutes:20,level:"Intermediate",intro:"False breakout-এ দাম level ছাড়িয়ে গিয়েও আবার ভেতরে ফিরে আসে। এর পেছনে অনেক সময় level-এর বাইরে থাকা অর্ডার বা stop-গুলোকে sweep করার চাপ থাকে।",points:["Level ছাড়ালেই breakout নিশ্চিত নয়","দ্রুত ফিরে আসা সতর্ক সংকেত","Sweep-এর পর বিপরীত দিকের structure দেখুন","নিশ্চিতকরণ ছাড়া বিপরীত ট্রেড নয়"],watch:"False breakout liquidity sweep price action",questions:[{q:"False breakout কী?",options:["Level ভেঙে টিকে থাকা","Level ছাড়িয়ে আবার ভেতরে ফিরে আসা","দাম না নড়া","নতুন trend শুরু হওয়া"],answer:1,explain:"দাম level-এর বাইরে গিয়ে আবার ভেতরে ফিরে এলে তাকে false breakout বলে।"},{q:"Liquidity sweep বলতে কী বোঝায়?",options:["দাম level-এর বাইরে গিয়ে সেখানকার অর্ডার স্পর্শ করে ফিরে আসা","টাকা জমা দেওয়া","চার্ট পরিষ্কার করা","সব candle মুছে ফেলা"],answer:0,explain:"গুরুত্বপূর্ণ level-এর বাইরে অনেক stop থাকে। দাম সেখানে গিয়ে ফিরে আসাকে sweep হিসেবে ব্যাখ্যা করা হয়।"},{q:"False breakout দেখলে প্রথমে কী করা উচিত?",options:["সঙ্গে সঙ্গে উল্টো ট্রেড নেওয়া","দাম level-এর ভেতরে ফিরেছে কি না দেখা","সব লেসন ভুলে যাওয়া","ঝুঁকি দ্বিগুণ করা"],answer:1,explain:"দাম level-এর ভেতরে ফিরে close দিচ্ছে কি না, সেটাই প্রথম পর্যবেক্ষণ।"}]},{id:7,title:"Order Block-এর ধারণা",enTitle:"Order Block Concept",goal:"সম্ভাব্য supply/demand area-কে সতর্কভাবে দে
